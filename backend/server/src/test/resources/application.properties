# 测试期的应用配置。
#
# ## 为什么需要这个文件
#
# 对局驱动（`GameDriver` + `gameDriverScheduler`）在**生产里默认开启**——它就是
# "AI 会行动"的实现。但它在测试上下文里必须关掉，否则它会和断言竞争同一个对局：
#
# - `SpeechDeltaDeliveryTest.speechDeltaDoesNotAdvanceSeq` 断言"发言增量不推进 seq"，
#   而驱动会在同一时刻把 AI 的回合推进掉，于是 seq 从 1 变成 3，测试失败；
# - 更要紧的是，**任何一个断言版本或阶段的测试都会变成时序竞态**——
#   "测试通过与否取决于调度线程的运气"是最难查的一类失败。
#
# 需要验证驱动本身时，测试应**自己调** `driver.step(gameId)` 并断言单步行为，
# 或者用 `@SpringBootTest(properties = "wolfmind.game.driver.enabled=true")` 显式打开。
#
# 心跳看护同理（第 23 轮的教训）：超时判定由测试自己驱动。

wolfmind.game.driver.enabled=false
wolfmind.ws.heartbeat.enabled=false
# 发言阅读停顿按真实时钟等待，会让手动 step 推进对局的测试白等；停顿本身由 GameDriverTest 覆盖。
wolfmind.game.speech-pacing.enabled=false
