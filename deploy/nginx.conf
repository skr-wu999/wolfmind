# WolfMind 前端 Nginx 配置：静态产物 + 同源反代。
#
# 为什么反代而不是让浏览器直连后端：
# 1. **同源**：不需要 CORS 白名单，也不需要把后端主机名写进前端产物；
# 2. **WebSocket 只有一条路径**：`/ws` 与 REST 走同一个 Host，会话 Cookie/令牌的语义只有一份；
# 3. **部署可复现**：换后端地址只改这份配置的 host，不用重新构建前端镜像。

server {
    listen 80;
    server_name _;

    # 前端是单页应用：产物里的 hash 文件名已经做过缓存失效，index.html 必须不缓存，
    # 否则用户会一直打开一个引用了已删除资源的旧页面。
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 容器健康检查用（不依赖后端）。
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # 带 hash 的构建产物可以长期缓存。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 对局提交与批量实验室请求会跑在几秒量级，默认 60s 对 SSE/长请求偏紧。
        proxy_read_timeout 120s;
    }

    # WebSocket：必须显式升级头，否则握手会退化成普通 GET 而 404。
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 心跳周期远小于这个值；它只用于回收真正断掉的连接。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA 回退：/lobby、/games/xxx 这类前端路由在刷新时不能 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
